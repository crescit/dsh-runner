[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsh-runner"
dynamic = ["version"]
description = "Run Hermes kanban cards through the DeepSeek Harness, committing only verified work"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Topic :: Software Development :: Build Tools",
]

[project.urls]
Repository = "https://github.com/crescit/dsh-runner"

[project.scripts]
dsh-runner = "dsh_runner.cli:main"

[tool.setuptools.dynamic]
version = { attr = "dsh_runner.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
